*{box-sizing:border-box;}
:root{
  --maroon:#7a1414; --maroon-dark:#5c0f0f; --gold:#c99a2e; --gold-light:#f4e4b8;
  --ink:#20201d; --line:#d9d3c4; --bg:#f4f1e8;
}
body{
  margin:0; padding:14px; background:var(--bg); color:var(--ink);
  font-family:'Amiri','Segoe UI',Tahoma,sans-serif; font-size:15px;
}
.sheet{max-width:840px; margin:0 auto; background:#fff; border:1px solid var(--line);
  border-radius:10px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.06);}
.topbar{background:linear-gradient(135deg,var(--maroon),var(--maroon-dark));
  padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
.topbar img{height:52px; border-radius:6px; background:#fff; padding:3px;}
.topbar h1{color:#fff; font-size:20px; margin:0; font-weight:700;}
.topbar .sub{color:var(--gold-light); font-size:12px; margin-top:2px;}
.body{padding:16px 18px;}
.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-bottom:14px;}
.field{display:flex; flex-direction:column; gap:4px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12.5px; color:var(--maroon-dark); font-weight:700;}
.field input[type=text], .field input[type=date], .field textarea{
  border:1.5px solid var(--line); border-radius:7px; padding:9px 10px; font-family:inherit;
  font-size:15px; background:#fdfcf9; color:var(--ink); width:100%;
}
.field input:focus, .field textarea:focus{outline:none; border-color:var(--gold);}
.pay-row{display:flex; gap:10px; align-items:center;}
.pay-chip{flex:1; text-align:center; padding:9px 6px; border:2px solid var(--line); border-radius:8px;
  cursor:pointer; font-weight:700; color:#777; user-select:none; transition:.15s;}
.pay-chip.active{border-color:#c0392b; color:#c0392b; background:#fdf0ee;}
table{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:6px;}
thead th{background:var(--gold-light); border:1px solid var(--line); padding:6px 4px;
  font-size:12.5px; color:var(--maroon-dark); position:sticky; top:0;}
tbody td{border:1px solid var(--line); padding:4px; text-align:center; vertical-align:middle;}
tbody td.name{text-align:right; padding-right:8px; font-weight:600;}
tbody tr:nth-child(even){background:#faf8f2;}
tbody input{width:100%; border:1px solid var(--line); border-radius:5px; padding:5px 4px;
  text-align:center; font-family:inherit; font-size:13.5px; background:#fff;}
tbody input:focus{outline:none; border-color:var(--gold); background:#fffdf5;}
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px;}
.notes-box textarea{min-height:90px; resize:vertical; line-height:1.6;}
.actions{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
button{font-family:inherit; font-size:14.5px; font-weight:700; padding:12px 16px; border-radius:9px;
  border:none; cursor:pointer;}
#btnPrint{background:var(--maroon); color:#fff; flex:2;}
#btnClear{background:#fff; color:var(--maroon); border:1.5px solid var(--maroon); flex:1;}
.hint{font-size:11.5px; color:#8a8577; margin-top:8px; text-align:center;}
@media print{
  body{background:#fff; padding:0;}
  .actions, .hint, .install-tip{display:none !important;}
  .sheet{box-shadow:none; border:none; max-width:100%;}
  .table-wrap{border:none;}
  thead{display:table-header-group;}
  tr{page-break-inside:avoid;}
  @page{size:A4; margin:10mm;}
}
.install-tip{background:#fff8e6; border:1px solid var(--gold); border-radius:8px; padding:8px 12px;
  font-size:12px; margin-bottom:12px; color:#6b5510; display:none;}
</style>
</head>

  <div class="topbar">
    <div>
      <h1>طلب شراء</h1>

  <div class="body">
    <div class="install-tip" id="installTip">لتثبيت النموذج على شاشة جوالك: افتح قائمة المتصفح ⋮ ثم "إضافة إلى الشاشة الرئيسية".</div>

    <div class="field-grid">
      <div class="field"><label>التاريخ</label><input type="date" id="fDate"></div>
      <div class="field"><label>العنوان</label><input type="text" id="fAddr" placeholder="مثال: غمدان"></div>
      <div class="field full"><label>اسم العميل</label><input type="text" id="fClient" placeholder="اسم العميل / المؤسسة"></div>
      <div class="field full">
        <label>طريقة الدفع</label>
        <div class="pay-row">
          <div class="pay-chip" data-val="نقدا" id="payCash">نقداً</div>
          <div class="pay-chip" data-val="ذمم" id="payCredit">ذمم</div>
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:9%">رقم المادة</th>
          <th style="width:34%">اسم المادة</th>
          <th style="width:12%">التعبئة</th>
          <th style="width:9%">الوحدة</th>
          <th style="width:18%">الكمية</th>
          <th style="width:18%">البونص</th>
        </tr></thead>
        <tbody id="itemsBody"></tbody>
      </table>
    </div>

    <div class="field notes-box" style="margin-top:14px;">
      <label>ملاحظات</label>
      <textarea id="fNotes" placeholder="اكتب أي ملاحظات هنا..."></textarea>
    </div>

    <div class="field-grid" style="margin-top:10px;">
      <div class="field"><label>توقيع المندوب</label><input type="text" id="fRep" value="فراس عمران"></div>
    </div>

    <div class="actions">
      <button id="btnPrint">📄 تنزيل / طباعة PDF</button>
      <button id="btnClear">مسح الكل</button>
    </div>
    <div class="hint">زر التنزيل يفتح نافذة الطباعة — اختر "حفظ كـ PDF" لحفظ الطلب كملف.</div>
  </div>
</div>

<script>
const ITEMS = [["10101", "شيبس سوبر رينج ( 60 ) غم", "1*6*10"], ["10107", "شيبس بازيلاء ( 60 ) غم", "1*6*10"], ["10102", "شيبس ذرة سوبر رينج ( 14 ) غم", "1*5*30"], ["10108", "شيبس ذرة تشيز بول ( 14 ) غم", "1*5*30"], ["10106", "شيبس ذرة بنكهة البازيلاء ( 14 ) غم", "1*5*30"], ["10212", "جاكر", "1*14"], ["10701", "رقائق بطاطا 40 غم - اورجينال", "1*50"], ["10702", "رقائق بطاطا 40 غم - جبنة", "1*50"], ["10703", "رقائق بطاطا 40 غم - مشاوي", "1*50"], ["10704", "رقائق بطاطا 40 غم - لبنة وبصل", "1*50"], ["10705", "رقائق بطاطا 40 غم - حار", "1*50"], ["10801", "يوغي شيبس ذرة حلقات 80 غم", ""], ["20101", "شوفان اورجينال ( 400 ) غم", "1*24"], ["20214", "شوفان بنكهة الشوكولاته ( 350 ) غم", "1*24"], ["20212", "شوفان لايت ( 350 ) غم", "1*24"], ["20103", "شوفان اورجينال ( 180 ) غم", "1*24"], ["20105", "شوفان بنكهة الشوكولاته ( 180 ) غم", "1*24"], ["20207", "شوفان فواكه ماليزي ( 160 ) غم", "1*24"], ["50105", "حلوى المكسرات ( 225 ) غم", "1*24"], ["20104", "اصابع شوفان اورجينال ( 15 ) غم", "1*12*24"], ["20106", "اصابع شوفان فراولة ( 15 ) غم", "1*12*24"], ["20107", "اصابع شوفان برتقال ( 15 ) غم", "1*12*24"], ["20108", "اصابع شوفان جوز هند ( 15 ) غم", "1*12*24"], ["20203", "اصابع شوفان بنكهة الشوكولاته ( 30 ) غم", "1*12*24"]];
const tbody = document.getElementById('itemsBody');
ITEMS.forEach(([code,name,pack],i)=>{
  const tr=document.createElement('tr');
  tr.innerHTML = `
    <td>${code}</td>
    <td class="name">${name}</td>
    <td dir="ltr" style="direction:ltr;unicode-bidi:embed;">${pack||''}</td>
    <td>cart</td>
    <td><input type="text" inputmode="decimal" data-k="qty" data-i="${i}" placeholder=""></td>
    <td><input type="text" inputmode="decimal" data-k="bonus" data-i="${i}" placeholder=""></td>
  `;
  tbody.appendChild(tr);
});

// Payment chip toggle
const payCash=document.getElementById('payCash'), payCredit=document.getElementById('payCredit');
let payVal='';
function setPay(v){
  payVal=v;
  payCash.classList.toggle('active', v==='نقدا');
  payCredit.classList.toggle('active', v==='ذمم');
  saveDraft();
}
payCash.onclick=()=>setPay('نقدا');
payCredit.onclick=()=>setPay('ذمم');

// Draft autosave
const KEY='gm_orderform_draft_v1';
function collect(){
  const qty={}, bonus={};
  document.querySelectorAll('input[data-k="qty"]').forEach(el=>qty[el.dataset.i]=el.value);
  document.querySelectorAll('input[data-k="bonus"]').forEach(el=>bonus[el.dataset.i]=el.value);
  return {
    date:document.getElementById('fDate').value,
    addr:document.getElementById('fAddr').value,
    client:document.getElementById('fClient').value,
    pay:payVal,
    notes:document.getElementById('fNotes').value,
    rep:document.getElementById('fRep').value,
    qty, bonus
  };
}
function saveDraft(){
  try{ localStorage.setItem(KEY, JSON.stringify(collect())); }catch(e){}
}
function restoreDraft(){
  let d; try{ d=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!d) return;
  document.getElementById('fDate').value = d.date||'';
  document.getElementById('fAddr').value = d.addr||'';
  document.getElementById('fClient').value = d.client||'';
  document.getElementById('fNotes').value = d.notes||'';
  document.getElementById('fRep').value = d.rep || 'فراس عمران';
  if(d.pay) setPay(d.pay);
  if(d.qty) Object.entries(d.qty).forEach(([i,v])=>{ const el=document.querySelector(`input[data-k="qty"][data-i="${i}"]`); if(el) el.value=v; });
  if(d.bonus) Object.entries(d.bonus).forEach(([i,v])=>{ const el=document.querySelector(`input[data-k="bonus"][data-i="${i}"]`); if(el) el.value=v; });
}
document.addEventListener('input', saveDraft);

// Default date = today
(function(){
  const t=new Date(); const iso=t.toISOString().slice(0,10);
  document.getElementById('fDate').value = iso;
})();
restoreDraft();

document.getElementById('btnPrint').onclick=()=>{
  if(document.activeElement) document.activeElement.blur();
  setTimeout(()=>window.print(), 50);
};
document.getElementById('btnClear').onclick=()=>{
  if(!confirm('مسح كل بيانات هذا الطلب؟')) return;
  localStorage.removeItem(KEY);
  document.getElementById('fAddr').value='';
  document.getElementById('fClient').value='';
  document.getElementById('fNotes').value='';
  document.getElementById('fRep').value='فراس عمران';
  setPay('');
  document.querySelectorAll('tbody input').forEach(el=>el.value='');
  const t=new Date(); document.getElementById('fDate').value=t.toISOString().slice(0,10);
};

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('service-worker.js').catch(()=>{});
}
if(!window.matchMedia('(display-mode: standalone)').matches){
  document.getElementById('installTip').style.display='block';
}
</script>
</body>
</html>
